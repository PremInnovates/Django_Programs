<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Data</h1>
    <a href="/add/">Add Student</a>
    <table border="1">
        <tr>
            <th>RollNo.</th>
            <th>Name</th>
            <th>Result</th>
            <th>Action</th>
        </tr>
        
        <tr>
        {% for stu in students %}
            <td>{{stu.rollno}}</td>
            <td>{{stu.name}}</td>
            <td>{{stu.result}}</td>
            <td><a href="/update/{{ stu.rollno }}">Edit</a>
                <a href="/delete/{{ stu.rollno }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
  
</body>
</html>
