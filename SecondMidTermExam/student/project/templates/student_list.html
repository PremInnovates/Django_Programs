<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>registered Students</h2>
    <table>
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Joined Date</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
        {% for student in students %}
        <table>
            <tr>
                <td>{{student.student_id}}</td>
                <td>{{student.name}}</td>
                <td>{{student.email}}</td>
                <td>{{student.age}}</td>
                <td>{{student.joined_date}}</td>
                <td><a href ="{% url 'update_student' student.id%}">Update</a></td>
                <td>
                    <form method="{% url 'delete_student' student.id %}" method="POST">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td>no Students registered yet.</td>
            </tr>
            {% endfor%}
        </table>
        <a href="{% url 'home' %}">Register New Student</a>
    </table>
</body>
</html>
